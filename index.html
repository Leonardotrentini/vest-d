<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vest Atacado | Direto do Fabricante</title>
<meta name="description" content="Compre direto do fabricante com a melhor qualidade e preço do mercado. Alta margem de lucro na revenda e envio para todo o Brasil.">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="index,follow">

<style>
  :root{
    --bg:#0b0b0d;
    --yellow:#f6c814;
    --yellow-dark:#d9ad00;
    --white:#ffffff;
    --muted:#b9b9c0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--white);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
  }
  .hero{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align:center;
    isolation:isolate;
    background:
      radial-gradient(ellipse 60% 55% at 50% 0%, rgba(255,255,255,.10), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(246,200,20,.10), transparent 70%),
      var(--bg);
  }
  .hero::before{
    content:"";
    position:absolute;inset:0;
    z-index:-1;
    pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(246,200,20,.55), transparent),
      radial-gradient(1px 1px at 40% 18%, rgba(246,200,20,.45), transparent),
      radial-gradient(1.5px 1.5px at 55% 25%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 62% 12%, rgba(246,200,20,.5), transparent),
      radial-gradient(1px 1px at 48% 38%, rgba(246,200,20,.35), transparent),
      radial-gradient(1px 1px at 35% 8%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 70% 32%, rgba(246,200,20,.3), transparent),
      radial-gradient(1px 1px at 52% 6%, rgba(246,200,20,.5), transparent);
    opacity:.9;
  }
  .wrap{max-width:860px;width:100%;display:flex;flex-direction:column;align-items:center}
  .logo{
    display:inline-flex;flex-direction:column;align-items:center;
    margin-bottom:28px;
    transform:rotate(-4deg);
  }
  .logo .vest{
    font-weight:900;font-style:italic;
    font-size:clamp(56px,16vw,120px);
    line-height:.85;letter-spacing:-2px;
    color:var(--white);
    text-shadow:0 6px 0 rgba(0,0,0,.35);
  }
  .logo .atacado{
    font-weight:900;font-style:italic;
    font-size:clamp(26px,7vw,52px);
    line-height:1;letter-spacing:1px;
    color:var(--yellow);
    margin-top:2px;
  }
  .logo .swoosh{
    width:110%;height:12px;margin-top:6px;
    background:var(--yellow);
    clip-path:polygon(0 0,100% 0,100% 15%,8% 100%);
  }
  h1{
    font-weight:900;font-style:italic;
    font-size:clamp(26px,6.2vw,56px);
    line-height:1.08;
    letter-spacing:-.5px;
    text-transform:uppercase;
    max-width:820px;
    padding:0 4px;
  }
  h1 .hl{color:var(--yellow)}
  .sub{
    margin-top:18px;
    display:flex;flex-direction:column;align-items:stretch;gap:8px;
    width:100%;max-width:420px;
  }
  .pill{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 14px;
    border:1px solid rgba(246,200,20,.35);
    background:rgba(246,200,20,.07);
    border-radius:999px;
    font-weight:700;
    font-size:clamp(14px,3.6vw,17px);
    color:var(--white);
    white-space:nowrap;
  }
  .pill b{color:var(--yellow);font-weight:800}
  .pill svg{flex-shrink:0}
  .cta{
    margin-top:28px;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:440px;
    min-height:56px;
    padding:18px 22px;
    background:var(--yellow);
    color:#0b0b0d;
    font-weight:900;font-style:italic;
    font-size:clamp(18px,4.5vw,26px);
    letter-spacing:.5px;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:14px;
    box-shadow:0 10px 0 var(--yellow-dark), 0 18px 40px rgba(246,200,20,.25);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{transform:translateY(8px);box-shadow:0 2px 0 var(--yellow-dark),0 6px 16px rgba(246,200,20,.2)}
  @media (hover:hover){
    .cta:hover{transform:translateY(2px);box-shadow:0 8px 0 var(--yellow-dark),0 14px 32px rgba(246,200,20,.3)}
  }
  @media (prefers-reduced-motion:no-preference){
    .cta{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{
      0%,100%{filter:brightness(1)}
      50%{filter:brightness(1.08)}
    }
  }
  .note{
    margin-top:18px;
    font-size:13px;font-weight:500;color:var(--muted);
  }
  @media (min-width:640px){
    .hero{padding:48px 20px}
    .logo{margin-bottom:40px}
    .logo .swoosh{height:14px}
    .sub{
      margin-top:22px;
      flex-direction:row;flex-wrap:wrap;justify-content:center;
      max-width:none;gap:10px;
    }
    .pill{white-space:normal;padding:10px 16px;font-size:clamp(15px,2.4vw,18px)}
    .cta{margin-top:38px;padding:22px 28px}
    .note{margin-top:22px;font-size:14px}
  }
</style>
</head>
